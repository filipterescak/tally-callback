<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tally callback</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:#f6f8f7; color:#15191a; }
  @media (prefers-color-scheme: dark) { body { background:#0f1213; color:#e7ebe9; } }
  main { max-width: 30rem; }
  h1 { font-size:1.1rem; margin:0 0 10px; }
  p { opacity:.75; }
  code { font-size:.85em; }
</style>
</head>
<body>
<main>
  <h1>Tally callback</h1>
  <p>Redirect endpoints for a personal budgeting app. Nothing here is interactive
     and nothing is stored: each page forwards its query string to the app that
     started the request.</p>
  <p><code>/native/</code> &mdash; macOS and iOS app<br>
     <code>/web/</code> &mdash; local web app</p>
</main>
</body>
</html>
