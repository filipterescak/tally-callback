<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to Tally</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f8f7; color: #15191a;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f1213; color: #e7ebe9; } }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 18px; opacity: .75; }
  a.btn {
    display: inline-block; padding: 9px 18px; border-radius: 7px;
    background: #1f5f5b; color: #fff; text-decoration: none; font-weight: 500;
  }
  @media (prefers-color-scheme: dark) { a.btn { background: #74b8b0; color: #0f1213; } }
  code { font-size: .85em; opacity: .6; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Returning to Tally</h1>
  <p>Your bank sent you back here. Handing the authorisation over to the app&hellip;</p>
  <p><a class="btn" id="go" href="#">Open Tally</a></p>
  <p><code id="why" hidden>If nothing happens, the app may not be running.</code></p>
</main>
<script>
  (function () {
    // Enable Banking appends ?code=...&state=... (or ?error=...). Pass the
    // whole query string through untouched — the app reads it.
    var target = "http://localhost:3000/api/connections/callback" + window.location.search;
    document.getElementById("go").setAttribute("href", target);
    try { window.location.replace(target); } catch (e) {}
    setTimeout(function () { document.getElementById("why").hidden = false; }, 2500);
  })();
</script>
</body>
</html>
